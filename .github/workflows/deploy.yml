# ============================================================
# Deploy automático a Vercel en cada push a main
# ============================================================
# Requisitos (una sola vez):
#   - Secret del repo: VERCEL_TOKEN  (Settings -> Secrets and variables -> Actions)
#   Las variables VITE_* NO van aquí: se leen automáticamente desde Vercel
#   con `vercel pull` (ya están configuradas en el proyecto).
name: Deploy a Vercel (producción)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # IDs del proyecto en Vercel (no son secretos).
  VERCEL_ORG_ID: team_vv7JAOS6mZFGsohgJ0w92lgf
  VERCEL_PROJECT_ID: prj_goDiuwEKNzf0kbU3ozNq2nFRQmAy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Traer configuración y variables de entorno de Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compilar (usa las VITE_* guardadas en Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Desplegar a producción
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
