# ============================================================
# Deploy automático a Vercel en cada push a main
# ============================================================
# Requisitos (una sola vez):
#   - Secret del repo: VERCEL_TOKEN  (Settings -> Secrets and variables -> Actions)
#
# El build se hace EN LOS SERVIDORES DE VERCEL (no en el runner), así las
# variables VITE_* configuradas en el proyecto se incrustan correctamente.
# (Un `vercel build` local no recibe esas variables y el sitio queda en blanco.)
name: Deploy a Vercel (producción)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # IDs del proyecto en Vercel (no son secretos).
  VERCEL_ORG_ID: team_vv7JAOS6mZFGsohgJ0w92lgf
  VERCEL_PROJECT_ID: prj_goDiuwEKNzf0kbU3ozNq2nFRQmAy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Desplegar a producción (build en servidor de Vercel)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
